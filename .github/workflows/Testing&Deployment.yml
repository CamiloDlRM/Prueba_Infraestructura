name: Run Unit Tests

on:
  push:
    branches:
      - main
      - videogame-registration-module
  pull_request:
    branches:
      - main
      - videogame-registration-module

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            npm run test:main
          elif [[ "${{ github.ref_name }}" == "videogame-registration-module" ]]; then
            npm run test:videogame-registration-module
          else
            npm run test
          fi

  docker-image:
    runs-on: ubuntu-latest
    needs: test  
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build the Docker image
        run:  docker build -f ./.devcontainer/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/my-image-name:latest ./.devcontainer

      - name: Push the image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-image-name:latest
